[package]
name = "oven-llm"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A Rust library for calling LLM providers with a unified API."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
secrecy = "0.10"
async-stream = "0.3"
eventsource-stream = "=0.2.3"

[dev-dependencies]
anyhow = "1"
proptest = "1"
wiremock = "0.6"
