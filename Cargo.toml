[package]
name = "oven-llm"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1"
secrecy = "0.10"
async-stream = "0.3"
eventsource-stream = "=0.2.3"
tracing = "0.1"

[dev-dependencies]
anyhow = "1"
proptest = "1"
wiremock = "0.6"
