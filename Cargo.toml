[package]
name = "oven-llm"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A Rust library for calling LLM providers with a unified API."
authors = ["Jowell Young <guza@duck.com>"]
build = false
include = ["README.md", "Cargo.toml", "LICENSE", "src/**/*.rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
isahc = "2.0"
futures-lite = "2"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
secrecy = "0.10"
async-stream = "0.3"
eventsource-stream = "=0.2.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
anyhow = "1"
proptest = "1"
wiremock = "0.6"
